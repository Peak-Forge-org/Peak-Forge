<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مدیریت برنامه‌ها</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/coach-base.css" />
    <link rel="stylesheet" href="/css/coach-programs.css" />
  </head>
  <body>
    <main class="page">
      <h1>مدیریت برنامه‌ها</h1>

      <div class="tabs" role="tablist">
        <button
          class="tab active"
          type="button"
          data-target="tplPanel"
          role="tab"
        >
          برنامه‌ها
        </button>
        <button
          class="tab"
          type="button"
          id="calTab"
          data-target="calPanel"
          data-premium="تقویم تمرینی"
          role="tab"
        >
          🔒 تقویم تمرینی
        </button>
      </div>

      <div id="tplPanel" class="panel">
        <div class="list" id="templates"></div>

        <form class="card" id="tplForm">
          <h2>تعریف برنامه‌ی جدید</h2>
          <div class="form-row">
            <label class="field">نام برنامه<input id="tplName" required /></label>
            <label class="field"
              >نوع<select id="tplType">
                <option>تمرینی</option>
                <option>غذایی</option>
              </select></label
            >
            <label class="field"
              >مدت (هفته)<input
                id="tplWeeks"
                type="number"
                min="1"
                max="52"
                value="4"
            /></label>
            <button class="btn" type="submit">ساخت</button>
          </div>
        </form>
      </div>

      <div id="calPanel" class="panel" hidden>
        <div class="list" id="calendar"></div>
        <form class="card" id="calForm">
          <h2>زمان‌بندی برنامه</h2>
          <div class="form-row">
            <label class="field">روز<select id="calDay"></select></label>
            <label class="field">برنامه<select id="calTpl"></select></label>
            <label class="field">برای<select id="calTarget"></select></label>
            <button class="btn" type="submit">افزودن</button>
          </div>
        </form>
      </div>
    </main>

    <dialog id="sendDlg">
      <h2 id="sendTitle"></h2>
      <p class="muted" id="sendSub">ورزشکار مقصد را انتخاب کنید</p>
      <div class="chips" id="sendCats" hidden></div>
      <div class="checks" id="sendList"></div>
      <div class="form-row dlg-actions">
        <button class="btn" type="button" id="sendGo">ارسال</button>
        <button class="btn ghost" type="button" id="sendCancel">انصراف</button>
      </div>
    </dialog>

    <dialog id="contentDlg">
      <h2 id="contentTitle"></h2>
      <p class="muted" id="contentSub"></p>
      <div class="content-list" id="contentList"></div>
      <form id="contentForm">
        <div class="form-row">
          <label class="field grow">نام<input id="cName" required /></label>
          <label class="field" id="cDayWrap">روز<select id="cDay"></select></label>
        </div>
        <div class="form-row">
          <label class="field" id="cSetsWrap">ست‌ها<input id="cSets" placeholder="مثلاً ۴ × ۱۰" /></label>
          <label class="field" id="cRestWrap">استراحت<input id="cRest" placeholder="مثلاً ۹۰ ثانیه" /></label>
          <label class="field" id="cTimeWrap">ساعت<input id="cTime" placeholder="مثلاً ۸:۰۰" /></label>
          <label class="field" id="cKcalWrap">کالری<input id="cKcal" type="number" min="0" step="1" placeholder="اختیاری" /></label>
        </div>
        <div class="form-row">
          <label class="field grow" id="cItemsWrap">موارد<input id="cItems" placeholder="مثلاً سینه مرغ، برنج، سالاد" /></label>
          <label class="field grow" id="cAltWrap">جایگزین (اختیاری)<input id="cAlt" /></label>
        </div>
        <div class="form-row dlg-actions">
          <button class="btn" type="submit">افزودن</button>
          <button class="btn ghost" type="button" id="contentClose">بستن</button>
        </div>
      </form>
    </dialog>

    <div class="footer">
      <div class="icon">
        <a href="/coach/chat.html"
          ><img src="/icons/comments (1).png" alt="چت"
        /></a>
      </div>
      <div class="icon">
        <a href="/coach/athletes.html"
          ><img src="/icons/users.svg" alt="ورزشکاران"
        /></a>
      </div>
      <div class="selected">
        <img src="/icons/dumbbell-ray.svg" alt="برنامه‌ها" />
      </div>
      <div class="icon">
        <a href="/coach/profile.html"
          ><img src="/icons/user.png" alt="پروفایل"
        /></a>
      </div>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/coach-common.js"></script>
    <script src="/js/coach-programs.js"></script>
  </body>
</html>
