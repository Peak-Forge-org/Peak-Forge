<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تمرین</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/athlete-exercise.css" />
    <link rel="stylesheet" href="/css/athlete-common.css" />
  </head>
  <body>
    <main class="page">
      <div class="week" id="week"></div>

      <section class="card day-card" id="dayCard">
        <div class="row-head">
          <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
            <circle class="ring-bg" cx="60" cy="60" r="52" />
            <circle class="ring-fill" id="ringFill" cx="60" cy="60" r="52" />
          </svg>
          <div class="ring-text">
            <strong id="percent">۰٪</strong>
            <span>انجام‌شده</span>
          </div>
        </div>
        <h2 id="dayName"></h2>
        <p class="muted" id="dayFocus"></p>
        <p class="count" id="dayCount"></p>
      </section>

      <div id="lists">
        <section class="card">
          <h3>باقی‌مانده <span class="badge" id="todoN"></span></h3>
          <div class="list" id="todoList"></div>
        </section>
        <section class="card">
          <h3>انجام‌شده <span class="badge" id="doneN"></span></h3>
          <div class="list" id="doneList"></div>
        </section>
      </div>
      <section class="card rest" id="restBox" hidden>
        <h2>روز استراحت 🛌</h2>
        <p class="muted">امروز تمرینی نداری — ریکاوری هم بخشی از برنامه است.</p>
      </section>

      <section class="card">
        <div class="row-head">
          <span class="muted" id="programWeek"></span>
        </div>
        <div class="bar big"><i id="programBar"></i></div>
        <div class="row-head small">
          <span class="muted" id="programText"></span>
          <span class="muted" id="programLeft"></span>
        </div>
      </section>
    </main>

    <dialog id="setsDlg">
      <h2 id="setsTitle"></h2>
      <p class="muted" id="setsSub"></p>
      <div class="sets-list" id="setsList"></div>
      <div class="sets-actions">
        <button class="btn-ghost" type="button" id="addSetBtn">+ ست</button>
      </div>
      <div class="sets-actions">
        <button class="btn-ghost primary" type="button" id="saveSets">ذخیره</button>
        <button class="btn-ghost" type="button" id="setsClose">بستن</button>
      </div>
    </dialog>

    <div class="footer">
      <div class="icon">
        <a href="/athlete/chat.html">
          <img src="/icons/comments (1).png" alt="چت" />
        </a>
      </div>

      <div class="selected">
        <img src="/icons/dumbbell-ray.png" alt="تمرین" />
      </div>

      <div class="icon">
        <a href="/athlete/diet.html">
          <img src="/icons/hamburger-soda.png" alt="تغذیه" />
        </a>
      </div>

      <div class="icon">
        <a href="/athlete/profile.html">
          <img src="/icons/user.svg" alt="پروفایل" />
        </a>
      </div>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/athlete-common.js"></script>
    <script src="/js/athlete-exercise.js"></script>
  </body>
</html>
